name: CI (Linux)

on: [push, pull_request]

jobs:
  test:
    name: CI / Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        uses: actions-rs/cargo@v1
        with:
          command: generate-lockfile

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.8.2

      - name: Install extra toolchains
        run: |
          rustup toolchain install 1.88.0
          rustup toolchain install nightly

      - name: Run Linux suites
        timeout-minutes: 120
        shell: bash
        run: |
          set -u -o pipefail

          echo "## Linux Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Toolchain | Runtime | Kind | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          failures=0
          base_features="ntex/cookie,ntex/url,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"

          run_suite() {
            local toolchain="$1"
            local runtime="$2"
            local kind="$3"
            local features="$4"
            local rc=0

            echo "::group::Linux | ${toolchain} | ${runtime} | ${kind}"
            if [ "${kind}" = "tests" ]; then
              cargo +"${toolchain}" nextest run --retries=3 --all --no-default-features --features="${features}"
              rc=$?
            else
              cargo +"${toolchain}" test --doc --all --no-default-features --features="${features}"
              rc=$?
            fi
            echo "::endgroup::"

            if [ $rc -eq 0 ]; then
              result="PASS"
            else
              result="FAIL (${rc})"
              failures=$((failures + 1))
            fi

            echo "| ${toolchain} | ${runtime} | ${kind} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          }

          for toolchain in 1.88.0 stable nightly; do
            for runtime in neon-polling neon-uring tokio compio; do
              features="ntex/${runtime},${base_features}"
              run_suite "${toolchain}" "${runtime}" "tests" "${features}"
              run_suite "${toolchain}" "${runtime}" "doc-tests" "${features}"
            done
          done

          if [ $failures -gt 0 ]; then
            echo ""
            echo "${failures} suite(s) failed."
            exit 1
          fi
