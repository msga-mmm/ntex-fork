name: CI / macOS

on: [push, pull_request]

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        version:
          - stable
          - nightly
        suite:
          - name: neon
            features: ntex/cookie,ntex/url,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws
          - name: tokio
            features: ntex/tokio,ntex/cookie,ntex/url,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws
          - name: compio
            features: ntex/compio,ntex/cookie,ntex/url,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws

    name: macOS / ${{ matrix.version }} / ${{ matrix.suite.name }}
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install ${{ matrix.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.version }}-aarch64-apple-darwin

      - name: Generate Cargo.lock
        uses: actions-rs/cargo@v1
        with:
          command: generate-lockfile

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.8.2

      - name: Run tests (${{ matrix.suite.name }})
        timeout-minutes: 10
        run: cargo nextest run --retries=3 --all --no-default-features --no-fail-fast --features="${{ matrix.suite.features }}"
