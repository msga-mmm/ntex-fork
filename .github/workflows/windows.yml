name: CI (Windows)

on: [push, pull_request]

env:
  VCPKGRS_DYNAMIC: 1

jobs:
  test:
    name: CI / Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        uses: actions-rs/cargo@v1
        with:
          command: generate-lockfile

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.8.2

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\
          key: x86_64-pc-windows-msvc-openssl

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: windows-x86_64-pc-windows-msvc-cargo-registry-trimmed-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: windows-x86_64-pc-windows-msvc-cargo-index-trimmed-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Cache openssl
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\x64-windows\
          key: x86_64-openssl

      - name: Install OpenSSL
        run: |
          $env:VCPKG_MANIFEST_MODE = 'OFF'
          vcpkg integrate install
          vcpkg install --clean-after-build openssl:x64-windows
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll C:\vcpkg\installed\x64-windows\bin\libcrypto.dll
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libssl-3-x64.dll C:\vcpkg\installed\x64-windows\bin\libssl.dll
          Get-ChildItem C:\vcpkg\installed\x64-windows\bin
          Get-ChildItem C:\vcpkg\installed\x64-windows\lib

      - name: Install extra toolchains
        run: rustup toolchain install nightly

      - name: Run Windows suites
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows Test Summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Toolchain | Runtime | Kind | Result |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| --- | --- | --- | --- |"

          $failures = 0
          $baseFeatures = "ntex/cookie,ntex/url,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"

          function Run-Suite {
            param(
              [string]$Toolchain,
              [string]$Runtime,
              [string]$Features
            )

            Write-Output "::group::Windows | $Toolchain | $Runtime | tests"
            cargo +$Toolchain nextest run --retries=3 --all --no-default-features --no-fail-fast --features="$Features" -- --skip test_timer
            $rc = $LASTEXITCODE
            Write-Output "::endgroup::"

            if ($rc -eq 0) {
              $result = "PASS"
            } else {
              $result = "FAIL ($rc)"
              $script:failures++
            }

            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $Toolchain | $Runtime | tests | $result |"
          }

          foreach ($toolchain in @("stable", "nightly")) {
            Run-Suite -Toolchain $toolchain -Runtime "tokio" -Features "ntex/tokio,$baseFeatures"
            Run-Suite -Toolchain $toolchain -Runtime "compio" -Features "ntex/compio,$baseFeatures"
          }

          if ($failures -gt 0) {
            Write-Output "$failures suite(s) failed."
            exit 1
          }
